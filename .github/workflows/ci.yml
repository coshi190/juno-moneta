name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    contracts:
        name: Contracts
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive
            - uses: foundry-rs/foundry-toolchain@v1
            # No `forge fmt --check`: the deployed contracts predate any fmt pass, and
            # reformatting them changes the source metadata hash, which would break exact-match
            # source verification on bkcscan against the already-deployed bytecode.
            - name: Build
              run: forge build
              working-directory: contracts
            - name: Test
              run: forge test -vvv
              working-directory: contracts

    sdk:
        name: SDK
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.0
            - run: bun install --frozen-lockfile
              working-directory: packages/sdk

            - name: Typecheck
              run: bun run typecheck
              working-directory: packages/sdk
            - name: Test
              run: bun run test
              working-directory: packages/sdk
            - name: Build
              run: bun run build
              working-directory: packages/sdk

    cli:
        name: CLI
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.0

            # The SDK must be installed AND built before the CLI installs. `file:../sdk`
            # resolves to a tree of per-file symlinks created at install time, so a missing
            # `dist` means the CLI links nothing and fails to resolve the SDK at runtime.
            - name: Install SDK
              run: bun install --frozen-lockfile
              working-directory: packages/sdk
            - name: Build SDK
              run: bun run build
              working-directory: packages/sdk

            - name: Install
              run: bun install --frozen-lockfile
              working-directory: packages/cli
            - name: Typecheck
              run: bun run typecheck
              working-directory: packages/cli
            - name: Build
              run: bun run build
              working-directory: packages/cli

    indexer:
        name: Indexer
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.0

            # Same ordering constraint as the CLI job above.
            - name: Install SDK
              run: bun install --frozen-lockfile
              working-directory: packages/sdk
            - name: Build SDK
              run: bun run build
              working-directory: packages/sdk

            - name: Install
              run: bun install --frozen-lockfile
              working-directory: indexer
            - name: Codegen
              run: bun run codegen
              working-directory: indexer
            - name: Typecheck
              run: bun run typecheck
              working-directory: indexer
            - name: Test
              run: bun run test
              working-directory: indexer
