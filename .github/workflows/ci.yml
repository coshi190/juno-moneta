name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    format:
        name: Format
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.0
            - name: Check
              run: bunx prettier@3.9.6 --check .

    contracts:
        name: Contracts
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive
            - uses: foundry-rs/foundry-toolchain@v1
            - name: Build
              run: forge build
              working-directory: contracts
            - name: Test
              run: forge test -vvv
              working-directory: contracts

    sdk:
        name: SDK
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.0
            - run: bun install --frozen-lockfile
              working-directory: packages/sdk

            - name: Typecheck
              run: bun run typecheck
              working-directory: packages/sdk
            - name: Test
              run: bun run test
              working-directory: packages/sdk
            - name: Build
              run: bun run build
              working-directory: packages/sdk

    cli:
        name: CLI
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.0
            - name: Install SDK
              run: bun install --frozen-lockfile
              working-directory: packages/sdk
            - name: Build SDK
              run: bun run build
              working-directory: packages/sdk

            - name: Install
              run: bun install --frozen-lockfile
              working-directory: packages/cli
            - name: Typecheck
              run: bun run typecheck
              working-directory: packages/cli
            - name: Build
              run: bun run build
              working-directory: packages/cli

    indexer:
        name: Indexer
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.0
            - name: Install SDK
              run: bun install --frozen-lockfile
              working-directory: packages/sdk
            - name: Build SDK
              run: bun run build
              working-directory: packages/sdk

            - name: Install
              run: bun install --frozen-lockfile
              working-directory: indexer
            - name: Codegen
              run: bun run codegen
              working-directory: indexer
            - name: Typecheck
              run: bun run typecheck
              working-directory: indexer
            - name: Test
              run: bun run test
              working-directory: indexer
